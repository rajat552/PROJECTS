<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Weather App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

    <h2>Weather App</h2>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button id="searchBtn">Search</button>
        <button id="locBtn">📍</button>
    </div>

    <div id="loader" class="loader hidden"></div>

    <div class="weather-box hidden" id="weatherBox">
        <img id="weatherIcon" src="" width="120">

        <h3 id="cityName"></h3>
        <p id="temp"></p>
        <p id="description"></p>

        <div class="details">
            <p><b>Feels Like:</b> <span id="feels"></span></p>
            <p><b>Humidity:</b> <span id="humidity"></span></p>
            <p><b>Pressure:</b> <span id="pressure"></span></p>
            <p><b>Wind:</b> <span id="wind"></span></p>
        </div>

        <button id="toggleBtn">Switch to °F</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
